<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="Anurag Naskar — student developer">
    <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101a31"/><stop offset="1" stop-color="#1a2943"/></linearGradient><linearGradient id="shine"><stop stop-color="#77e0c3" stop-opacity="0"/><stop offset=".5" stop-color="#77e0c3" stop-opacity=".55"/><stop offset="1" stop-color="#77e0c3" stop-opacity="0"/></linearGradient></defs>
    <style>
      @keyframes rise { from { opacity:0; transform:translateY(12px) } to { opacity:1; transform:translateY(0) } }
      @keyframes sweep { 0%,72%,100% { transform:translateX(-120px); opacity:0 } 8%,60% { opacity:.7 } 35% { transform:translateX(680px); opacity:0 } }
      @keyframes pop { from { opacity:0; transform:scale(.55) } to { opacity:1; transform:scale(1) } }
      .intro { animation:rise .7s ease-out both }
      .shine { animation:sweep 7s ease-in-out infinite }
      .cell { transform-box:fill-box; transform-origin:center; animation:pop .38s ease-out both }
      @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation:none !important; transition:none !important } }
    </style><rect width="1000" height="250" rx="24" fill="url(#bg)"/><circle cx="890" cy="30" r="180" fill="#6d83ff" opacity=".08"/><circle cx="960" cy="210" r="130" fill="#77e0c3" opacity=".07"/>
    <g class="intro"><text x="62" y="68" fill="#77e0c3" font-family="ui-monospace,monospace" font-size="16" letter-spacing="3">ANURAG NASKAR  /  DEVELOPER</text><text x="58" y="148" fill="#e9eefb" font-family="Arial,sans-serif" font-size="62" font-weight="700">Building ideas into</text><text x="58" y="215" fill="#e9eefb" font-family="Arial,sans-serif" font-size="62" font-weight="700">useful software.</text><rect class="shine" x="60" y="86" width="90" height="150" fill="url(#shine)" opacity=".35"/></g>
    <text x="760" y="94" fill="#a6b2cc" font-family="ui-monospace,monospace" font-size="15">FOCUS</text><text x="760" y="128" fill="#e9eefb" font-family="Arial,sans-serif" font-size="19">Web apps</text><text x="760" y="158" fill="#e9eefb" font-family="Arial,sans-serif" font-size="19">Applied ML</text><text x="760" y="188" fill="#e9eefb" font-family="Arial,sans-serif" font-size="19">Cloud learning</text>
    </svg>

